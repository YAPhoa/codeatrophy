name: Release

# A tag vX.Y.Z on a commit of main publishes that release: the image for
# linux/amd64 and linux/arm64 at ghcr.io/yaphoa/codeatrophy, tagged X.Y.Z,
# X.Y, X and latest, and the GitHub release with its notes
# (CONTRIBUTING.md, "Releases").

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release (image and GitHub release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main's history, to check the tag is on it
      - name: The tag is the version compose.yaml installs, on main
        run: |
          tag=$GITHUB_REF_NAME
          # The version is the default in the image line of compose.yaml,
          # whose ${...} the pattern matches as text, hence single quotes.
          # shellcheck disable=SC2016
          written=$(sed -n 's|^ *image: ghcr\.io/yaphoa/codeatrophy:${CODEATROPHY_VERSION:-\([^}]*\)}$|\1|p' compose.yaml)
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag $tag is not of the form vX.Y.Z."
            exit 1
          fi
          if [ "$tag" != "v$written" ]; then
            echo "::error::The tag is $tag, but compose.yaml installs ${written:-no version}."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tagged commit is not on main."
            exit 1
          fi
      - name: Log in to the GitHub container registry
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push for linux/amd64 and linux/arm64
        run: |
          version=${GITHUB_REF_NAME#v}
          image=ghcr.io/yaphoa/codeatrophy
          description="Self-hosted library of coding challenges and technical readings"
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg VERSION="$version" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version="$version" \
            --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            --label org.opencontainers.image.licenses=AGPL-3.0-only \
            --label org.opencontainers.image.description="$description" \
            --annotation "index:org.opencontainers.image.description=$description" \
            -t "$image:$version" -t "$image:${version%.*}" -t "$image:${version%%.*}" -t "$image:latest" .
      - name: Create the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --notes "To upgrade an existing instance, follow [Upgrading]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/storage.md#upgrading)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
