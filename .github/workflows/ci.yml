name: CI

# The checks CONTRIBUTING.md asks for before every commit, run again here:
# `make check`, the race detector, and the browser tests.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces the run of an older one, except on dev and main,
  # where every commit is checked and dev's staging image is published.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

# Each job's `if` keeps a branch of this repository from running twice, once
# for the push and once for its pull request: a push always runs, and a pull
# request runs only when it comes from a fork.

jobs:
  server:
    name: Server (vet, format, tests on SQLite and PostgreSQL)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Vet and format
        run: make vet fmt-check
      - name: Tests on SQLite
        run: make test
      - name: Tests on PostgreSQL
        run: make test-postgres

  race:
    name: Server (race detector)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Tests with the race detector
        run: make test-race

  vulnerabilities:
    name: Server (known vulnerabilities)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  image:
    name: Docker image (build and start)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The release publishes the image for both platforms. A container
      # builder builds them together whatever image store Docker uses.
      - name: Build for linux/amd64 and linux/arm64
        run: |
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 .
      - name: Load the linux/amd64 image
        run: docker buildx build --platform linux/amd64 --load -t codeatrophy:ci .
      - name: The container starts and answers its health check
        run: |
          docker run -d --name app codeatrophy:ci
          for _ in $(seq 30); do
            if docker exec app /usr/local/bin/codeatrophy healthcheck; then exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1

  web:
    name: UI (lint, types, unit tests, build)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # NODE_VERSION of the Makefile and the Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: make web-deps
      - name: Lint and type check
        run: make web-lint web-typecheck
      - name: Unit tests
        run: make web-test
      - name: Build
        run: npm run build
        working-directory: web

  e2e:
    name: UI (browser tests)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # NODE_VERSION of the Makefile and the Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: make web-deps
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser tests
        run: npm run test:e2e
        working-directory: web
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: web/node_modules/.tmp/e2e-results
          retention-days: 7

  # A push to dev that passes every job above publishes the staging image,
  # ghcr.io/yaphoa/codeatrophy:dev and :dev-<commit>, for both platforms
  # (CONTRIBUTING.md, "Releases"). Only this job may write packages.
  staging-image:
    name: Staging image (publish dev)
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [server, race, vulnerabilities, image, web, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, for git describe
      - name: Log in to the GitHub container registry
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push for linux/amd64 and linux/arm64
        run: |
          # The version the Makefile gives a build: the release tag this
          # commit is past (1.0.0-3-gabc1234), or the commit alone before
          # the first tag.
          version=$(git describe --tags --always --dirty)
          version=${version#v}
          image=ghcr.io/yaphoa/codeatrophy
          description="Self-hosted library of coding challenges and technical readings"
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg VERSION="$version" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version="$version" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.licenses=AGPL-3.0-only \
            --label org.opencontainers.image.description="$description" \
            --annotation "index:org.opencontainers.image.description=$description" \
            -t "$image:dev" -t "$image:dev-${GITHUB_SHA::7}" .
