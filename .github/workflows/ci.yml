name: CI

# The checks CONTRIBUTING.md asks for before every commit, run again here:
# `make check`, the race detector, and the browser tests.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Each job's `if` keeps a branch of this repository from running twice, once
# for the push and once for its pull request: a push always runs, and a pull
# request runs only when it comes from a fork.

jobs:
  server:
    name: Server (vet, format, tests on SQLite and PostgreSQL)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Vet and format
        run: make vet fmt-check
      - name: Tests on SQLite
        run: make test
      - name: Tests on PostgreSQL
        run: make test-postgres

  race:
    name: Server (race detector)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Tests with the race detector
        run: make test-race

  vulnerabilities:
    name: Server (known vulnerabilities)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  image:
    name: Docker image (build and start)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -t codeatrophy:ci .
      - name: The container starts and answers its health check
        run: |
          docker run -d --name app codeatrophy:ci
          for i in $(seq 30); do
            if docker exec app /usr/local/bin/codeatrophy healthcheck; then exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1

  web:
    name: UI (lint, types, unit tests, build)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # NODE_VERSION of the Makefile and the Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: make web-deps
      - name: Lint and type check
        run: make web-lint web-typecheck
      - name: Unit tests
        run: make web-test
      - name: Build
        run: npm run build
        working-directory: web

  e2e:
    name: UI (browser tests)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # NODE_VERSION of the Makefile and the Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: make web-deps
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser tests
        run: npm run test:e2e
        working-directory: web
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: web/node_modules/.tmp/e2e-results
          retention-days: 7
