# Codeatrophy: the app, its PostgreSQL database and the Judge0 judge engine.
#
# Configuration lives in .env (start from .env.example). The Judge0 services
# belong to the "judge0" profile, which .env.example enables through
# COMPOSE_PROFILES. To run without a judge engine, set
# CODEATROPHY_JUDGE_ENGINE=none and remove judge0 from COMPOSE_PROFILES.
#
# The app keeps its library in the db service (PostgreSQL). To keep it in
# SQLite in the codeatrophy-data volume instead, set CODEATROPHY_DATABASE_URL=
# (empty) in .env. An existing SQLite database in that volume is imported
# into an empty PostgreSQL database once, at startup.

name: codeatrophy

x-judge0-env: &judge0-env
  REDIS_HOST: judge0-redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-codeatrophy-judge0-redis}
  POSTGRES_HOST: judge0-db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: judge0
  POSTGRES_USER: judge0
  POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-codeatrophy-judge0-postgres}
  AUTHN_TOKEN: ${CODEATROPHY_JUDGE0_AUTH_TOKEN:-}
  # Number of Judge0 worker processes.
  COUNT: ${JUDGE0_WORKER_COUNT:-4}
  # Upper bounds the adapter may request. The address-space allowance for
  # JVM, Node and similar runtimes needs a high memory ceiling.
  MAX_CPU_TIME_LIMIT: "30"
  MAX_WALL_TIME_LIMIT: "60"
  MAX_MEMORY_LIMIT: "8388608"
  MAX_PROCESSES_AND_OR_THREADS: "128"
  # Output file size in KB: expected outputs may be up to 8 MiB.
  MAX_FILE_SIZE: "9216"
  MAX_MAX_FILE_SIZE: "16384"
  MAX_MAX_PROCESSES_AND_OR_THREADS: "256"
  ENABLE_WAIT_RESULT: "false"
  ENABLE_CALLBACKS: "false"
  ENABLE_SUBMISSION_DELETE: "false"
  ALLOW_ENABLE_NETWORK: "false"
  ENABLE_NETWORK: "false"

services:
  app:
    build:
      context: .
      args:
        VERSION: ${CODEATROPHY_VERSION:-0.1.0}
    image: codeatrophy:${CODEATROPHY_VERSION:-0.1.0}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CODEATROPHY_ADDR: ":8080"
      # Holds secret.key, and the SQLite database when that is used.
      CODEATROPHY_DATA_DIR: /data
      CODEATROPHY_DATABASE_URL: ${CODEATROPHY_DATABASE_URL-postgres://codeatrophy:${CODEATROPHY_POSTGRES_PASSWORD:-codeatrophy-postgres}@db:5432/codeatrophy?sslmode=disable}
      CODEATROPHY_JUDGE_ENGINE: ${CODEATROPHY_JUDGE_ENGINE:-none}
      CODEATROPHY_JUDGE0_URL: ${CODEATROPHY_JUDGE0_URL:-http://judge0-server:2358}
    ports:
      # Loopback only by default: the app has no authentication and can
      # execute code.
      - "${CODEATROPHY_BIND_ADDRESS:-127.0.0.1}:${CODEATROPHY_HOST_PORT:-8080}:8080"
    volumes:
      - codeatrophy-data:/data
    networks:
      - default
      - db
      - judge0
    depends_on:
      db:
        condition: service_healthy
      judge0-server:
        condition: service_started
        required: false

  # The app's database. It is reachable only from the app, on the db network,
  # and not published to the host.
  db:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: codeatrophy
      POSTGRES_USER: codeatrophy
      # Used when the volume is first initialised; see .env.example.
      POSTGRES_PASSWORD: ${CODEATROPHY_POSTGRES_PASSWORD:-codeatrophy-postgres}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18.
      - codeatrophy-db:/var/lib/postgresql
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U codeatrophy -d codeatrophy"]
      interval: 5s
      timeout: 5s
      retries: 30

  judge0-server:
    image: judge0/judge0:1.13.1
    profiles: [judge0]
    restart: unless-stopped
    environment: *judge0-env
    networks: [judge0]
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-workers:
    image: judge0/judge0:1.13.1
    profiles: [judge0]
    command: ["./scripts/workers"]
    restart: unless-stopped
    # The isolate sandbox needs a privileged container.
    privileged: true
    environment: *judge0-env
    networks: [judge0]
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-db:
    image: postgres:17.6
    profiles: [judge0]
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-codeatrophy-judge0-postgres}
    volumes:
      - judge0-db:/var/lib/postgresql/data
    networks: [judge0]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 5s
      retries: 20

  judge0-redis:
    image: redis:7.4
    profiles: [judge0]
    restart: unless-stopped
    command: ["sh", "-c", 'exec redis-server --appendonly no --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${JUDGE0_REDIS_PASSWORD:-codeatrophy-judge0-redis}
    networks: [judge0]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  default: {}
  # The database and Judge0 have no route to the outside world.
  db:
    internal: true
  judge0:
    internal: true

volumes:
  codeatrophy-data: {}
  codeatrophy-db: {}
  judge0-db: {}
