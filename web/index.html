<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The page background of each theme; lib/theme.ts keeps it in step with the theme in use. -->
    <meta name="theme-color" content="#f3f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f141c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <title>Codeatrophy</title>
    <!-- Before the first paint, so a reload in the dark theme does not flash white
         while the stylesheet and lib/theme.ts load, and nothing animates on it
         while motion is reduced. Keep the storage keys and the two backgrounds
         (--bg) in step with lib/theme.ts, lib/motion.ts and styles/tokens.css.
         `is-booting` keeps the app hidden until lib/boot.ts shows it whole;
         layout.css fades it in. -->
    <script>
      document.documentElement.classList.add('is-booting');
      try {
        var t = localStorage.getItem('codeatrophy:theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
      // Reduce motion (lib/motion.ts): on when chosen so (`reduce`), or, with nothing
      // chosen, when the OS asks for it. The stylesheets key on this attribute.
      try {
        var m = null;
        try { m = localStorage.getItem('codeatrophy:motion'); } catch (e) {}
        if (m === 'reduce' || (m !== 'full' && matchMedia('(prefers-reduced-motion: reduce)').matches)) document.documentElement.dataset.motion = 'reduce';
      } catch (e) {}
    </script>
    <style>
      :root { background: #f3f6f4; }
      :root[data-theme='dark'] { color-scheme: dark; background: #0f141c; }
      :root.is-booting #root { visibility: hidden; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
